name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Verify
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Repository Hygiene & Privacy
        run: powershell -ExecutionPolicy Bypass -File scripts\check-repo.ps1

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Build Detour CLI and Service
        run: go build -trimpath -v -o _dist\detour.exe .\cmd\detour

      - name: Build Detour GUI
        run: go build -trimpath -ldflags="-H=windowsgui" -v -o _dist\detour-ui.exe .\cmd\detour-ui
